<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form novalidate>
      <label for="email">Enter your email</label>
      <input type="email" name="email" id="email" autocomplete="off" required/>

      <label for="country">Enter your country</label>
      <input type="text" name="country" id="country" autocomplete="off" required/>

      <label for="postcode">Enter your postcode</label>
      <input type="text" name="postcode" id="postcode" autocomplete="off" required/>

      <label for="password">Enter your password</label>
      <input
        type="password"
        name="password"
        id="password"
        minlength="8"
        maxlength="20"
        autocomplete="off"
        required
      />

      <label for="password-repeat">Enter your password again</label>
      <input
        type="password"
        name="password-repeat"
        id="password-repeat"
        minlength="8"
        maxlength="20"
        autocomplete="off"
        required
      />

      <button type="submit">Submit form</button>
    </form>
  </body>
</html>
