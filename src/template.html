      <label for="postcode">Enter your postcode</label>

      <label for="password">Enter your password</label>
      <input
        type="password"
        name="password"
        id="password"
        minlength="8"
        maxlength="20"
        autocomplete="off"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}"
        required
      />

      <label for="password-repeat">Enter your password again</label>
      <input
        type="password"
        name="password-repeat"
        id="password-repeat"
        minlength="8"
        maxlength="20"
        autocomplete="off"
        disabled
        required
      />
